name: Sync Times From iqamah.ca

on:
  schedule:
    # Avoid the start of the hour, when scheduled jobs are most likely to be dropped.
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to sync and push to"
        required: false
        default: "production"

permissions:
  contents: write

concurrency:
  group: sync-times-production
  cancel-in-progress: false

jobs:
  sync-times:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests

      - name: Sync Time Variables
        run: python scripts/sync_times.py --source https://iqamah.ca/ --target index.html

      - name: Check For Changes
        id: diff
        run: |
          if git diff --quiet -- index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore(times): sync prayer time variables from iqamah.ca"

      - name: Push Changes
        if: steps.diff.outputs.changed == 'true'
        run: git push origin HEAD:${TARGET_BRANCH}

      # GITHUB_TOKEN pushes do not start the separate push-triggered deploy job.
      - name: Setup Node
        if: steps.diff.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        if: steps.diff.outputs.changed == 'true'
        run: npm install -g firebase-tools

      - name: Deploy Updated Schedule
        if: steps.diff.outputs.changed == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting

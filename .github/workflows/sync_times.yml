name: Sync Times From iqamah.ca

on:
  schedule:
    # Avoid the start of the hour, when scheduled jobs are most likely to be dropped.
    - cron: "17 12 * * *"
  # Run right away when the sync itself changes, so a fix is tested on a real runner.
  push:
    branches:
      - production
    paths:
      - scripts/sync_times.py
      - .github/workflows/sync_times.yml
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to sync and push to"
        required: false
        default: "production"

permissions:
  contents: write

# Shared with the deploy workflow so the two never deploy at the same time.
concurrency:
  group: production-site
  cancel-in-progress: false

jobs:
  sync-times:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests

      - name: Sync Time Variables
        id: sync
        run: python scripts/sync_times.py --source https://iqamah.ca/ --target index.html

      # The script still applies the Fajr iqamah rule when iqamah.ca can't be read,
      # so the steps below also run after a failed sync. The job still ends as failed.
      - name: Check For Changes
        id: diff
        if: ${{ !cancelled() && steps.sync.outcome != 'skipped' }}
        run: |
          if git diff --quiet -- index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Changes
        id: commit
        if: ${{ !cancelled() && steps.diff.outputs.changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore(times): sync prayer time variables from iqamah.ca"

      - name: Push Changes
        id: push
        if: ${{ !cancelled() && steps.commit.outcome == 'success' }}
        run: git push origin HEAD:${TARGET_BRANCH}

      # GITHUB_TOKEN pushes do not start the separate push-triggered deploy job.
      - name: Setup Node
        if: ${{ !cancelled() && steps.push.outcome == 'success' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        if: ${{ !cancelled() && steps.push.outcome == 'success' }}
        run: npm install -g firebase-tools

      - name: Deploy Updated Schedule
        if: ${{ !cancelled() && steps.push.outcome == 'success' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting
